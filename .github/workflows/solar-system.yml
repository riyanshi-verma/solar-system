name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

jobs:
  unit-testing:
    name: Unit Testing
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Check MongoDB Variables
        run: |
          echo "MONGO_URI=$MONGO_URI"
          echo "MONGO_USERNAME=$MONGO_USERNAME"

          if [ -n "$MONGO_PASSWORD" ]; then
            echo "MONGO_PASSWORD is available"
          else
            echo "MONGO_PASSWORD is NOT available"
            exit 1
          fi

      - name: Check MongoDB Password
        run: |
          node -e "
          const expected = 'SuperPassword';
          const actual = process.env.MONGO_PASSWORD;

          console.log('Expected password length:', expected.length);
          console.log('Actual password length:', actual.length);
          console.log('Exact password match:', actual === expected);

          if (actual !== expected) {
            console.log('Password does NOT match.');
            process.exit(1);
          }

          console.log('Password exactly matches.');
          "

      - name: Test MongoDB Connection
        run: |
          node -e "
          const mongoose = require('mongoose');

          console.log('Starting MongoDB connection test...');

          mongoose.connect(process.env.MONGO_URI, {
            user: process.env.MONGO_USERNAME,
            pass: process.env.MONGO_PASSWORD,
            useNewUrlParser: true,
            useUnifiedTopology: true
          })
          .then(() => {
            console.log('MongoDB Connection Successful');
            return mongoose.connection.close();
          })
          .then(() => {
            process.exit(0);
          })
          .catch(err => {
            console.log('MongoDB Connection Failed');
            console.log(err.message);
            process.exit(1);
          });
          "

      - name: Unit Testing
        run: npm test